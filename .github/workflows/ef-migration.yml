# Служебный процесс: формирование миграции EF Core на сервере GitHub (запуск вручную).
# Миграция сохраняется в каталог src/RoomBooking.Web/Data/Migrations отдельным коммитом.
name: ef-migration

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Имя миграции'
        required: true
        default: 'CreateRoomsAndReservations'

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install --global dotnet-ef --version 10.0.15
      - run: dotnet restore RoomBooking.sln
      - run: dotnet ef migrations add ${{ inputs.name }} --project src/RoomBooking.Web --output-dir Data/Migrations
      - name: Сохранение миграции
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/RoomBooking.Web/Data/Migrations
          git commit -m "Этап 2: миграция ${{ inputs.name }}"
          git push
